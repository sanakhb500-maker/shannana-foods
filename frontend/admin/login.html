<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>تسجيل الدخول | لوحة إدارة شنانة فودز</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-panel">
      <div class="login-card">
        <div class="login-logo">
          <img id="logo" src="/img/shannana-logo.png" alt="شنانة فودز" />
          <span class="login-logo-fallback" id="logoFallback" hidden>شنانة فودز</span>
        </div>
        <h1>تسجيل دخول المدير</h1>
        <p class="login-sub">أدخل بيانات حسابك للوصول إلى لوحة التحكم.</p>
        <form id="loginForm" novalidate>
          <div class="field" id="emailField">
            <label for="email">البريد الإلكتروني</label>
            <input id="email" name="email" type="email" dir="ltr" autocomplete="username" maxlength="254" required />
          </div>
          <div class="field" id="passwordField">
            <label for="password">كلمة المرور</label>
            <div class="pw-wrap">
              <input id="password" name="password" type="password" dir="ltr" autocomplete="current-password" maxlength="128" required />
              <button class="pw-toggle" id="pwToggle" type="button" aria-label="إظهار كلمة المرور">إظهار</button>
            </div>
          </div>
          <div class="form-error" id="formError" role="alert" hidden></div>
          <button class="btn btn-primary btn-block" id="submitBtn" type="submit">دخول</button>
        </form>
        <a class="back-link" href="/">← العودة إلى الموقع</a>
      </div>
    </section>
    <section class="login-brand" aria-hidden="true">
      <span class="kicker">لوحة الإدارة</span>
      <h2>أدِر منتجات شنانة فودز<br>من مكان واحد.</h2>
      <p>تحكم بالمنتجات والتصنيفات واستقبل الاستفسارات وطلبات التوزيع بسهولة وأمان.</p>
    </section>
  </main>
  <script src="/admin/login.js" defer></script>
</body>
</html>
